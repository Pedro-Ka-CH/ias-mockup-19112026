<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAS | Treasury cash view (mockup)</title>
<style>
:root{--paper:#fafaf7;--ink:#14202e;--mut:#6f7480;--rule:#d9dde3;--acc:#1663c7;--acc2:#21b07c;--sand:#9fb8d6;--red:#b8321f;--amb:#b7791f;--grn:#2f7d4f;--wash:#eef1f4;--f:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;--fh:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;--fm:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font:14px/1.5 var(--f);padding-bottom:60px}
.serif,h1{font-family:var(--fh);font-weight:400}
b,strong{font-weight:600}
.hdr{border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:20}
.hdr .wrap{display:flex;align-items:center;gap:16px;height:58px}
.logo{height:34px;display:block}
.prod{font:12px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);border-left:1px solid var(--sand);padding-left:16px}
.hdr .demo{margin-left:auto}
.wrap{max-width:1040px;margin:0 auto;padding:0 28px}
.lnk{color:var(--acc);cursor:pointer;text-decoration:none;border-bottom:1px solid var(--sand)}
.lnk:hover{border-color:var(--acc)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 28px;padding:14px 0 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px}
.brand{font:600 12px var(--fm);letter-spacing:.14em;text-transform:uppercase}
.views{display:flex;gap:22px;margin-left:auto;align-self:flex-end;flex-wrap:wrap}
.views span{cursor:pointer;color:var(--mut);padding:0 0 12px;margin-bottom:-1px;border-bottom:2px solid transparent;white-space:nowrap}
.views span.on{color:var(--ink);border-color:var(--acc)}
.views span{display:inline-flex;align-items:baseline;gap:6px}
.sc{display:inline-block;font:600 9.5px var(--fm);letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:0 6px;font-style:normal;line-height:16px}
.sc.p{background:#e3f4ec;color:#1b6b45}.sc.o{background:#efe9fb;color:#5a3fb8}.sc.r{background:#eceef1;color:#5b6170}
.scopebar{display:none}
.rmbar{margin:22px 0 0;padding:12px 16px;border:1px dashed #cbbcf0;border-radius:10px;background:#faf8ff;font-size:13px}
.rmbar .chip.on{background:#5a3fb8;border-color:#5a3fb8;color:#fff}
.sc.r{background:#efe9fb;color:#5a3fb8}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.demo{color:#8a6d00;border:1px solid #d9c27a;padding:1px 7px}
.focus{display:inline-flex;gap:6px;align-items:center;background:var(--wash);padding:2px 10px;border-radius:12px;font-size:12.5px}
.focus b{cursor:pointer;color:var(--mut);font-weight:400}
.eyebrow{margin:30px 0 4px;color:var(--mut);font-size:12.5px}
.hero{font-size:44px;line-height:1.12;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:#4d535d;max-width:780px;font-size:15px;margin:0 0 6px}
.brief{border-left:2px solid var(--acc2);padding-left:12px;margin-top:14px;max-width:780px;color:#4d535d}
.brief p{margin:4px 0}
h2{font:600 11.5px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
section{padding:26px 0;border-top:1px solid var(--rule)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.att{display:grid;grid-template-columns:14px 1fr auto;gap:8px 12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--wash)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--amb)}
.dot.critical{background:var(--red)}.dot.info{background:var(--sand)}.dot.ok{background:var(--grn)}
.bar{display:grid;grid-template-columns:130px 1fr 64px;gap:10px;align-items:center;padding:3px 0;cursor:pointer;font-size:13px}
.bar:hover .lbl{text-decoration:underline}
.bar .trk{height:12px;position:relative}.bar .fill{height:12px;background:var(--acc);display:block}
.bar.sel .fill{background:var(--ink)}.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.bar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read{min-height:22px;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
input[type=range]{width:200px;accent-color:var(--acc);vertical-align:middle}
.chip{display:inline-block;border:1px solid var(--rule);padding:3px 11px;border-radius:14px;cursor:pointer;font-size:12.5px;color:#4b505a;background:var(--paper)}.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin:16px 0 8px}.stat .n1{font:30px/1.15 var(--fh)}.stat .l{font:600 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.stat .s{font-size:12px;color:var(--mut)}
.sbar{display:grid;grid-template-columns:200px 1fr 120px;gap:10px;align-items:center;font-size:13px;padding:3px 0}.sbar .trk{height:10px;background:var(--wash);display:block}.sbar .fill{display:block;height:10px}
.scen{display:flex;gap:12px;align-items:center;font-size:13px;margin:0 0 6px;flex-wrap:wrap}.scen label{min-width:290px}
svg text{font:11px "Segoe UI",Helvetica,Arial,sans-serif;fill:#6b707a}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--wash);vertical-align:top}
tr.tot td{border-bottom:1px solid var(--ink)}
.n{text-align:right;font-variant-numeric:tabular-nums}.neg{color:var(--red)}.pos{color:var(--grn)}.mut{color:var(--mut)}
input[type=text]{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:6px 2px;font:inherit;width:260px;outline:none}
.note{color:var(--mut);font-size:12.5px;max-width:780px}
details.fold{border:1px solid var(--rule);border-radius:10px;margin:12px 0;background:var(--paper)}
details.fold>summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"\25B8";color:var(--mut);transition:transform .15s;display:inline-block}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary .mut{font-weight:400;font-size:12.5px}
details.fold>.fb{padding:2px 16px 16px;border-top:1px solid var(--wash)}
details.fold:hover{border-color:var(--sand)}
.ask{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--acc);cursor:pointer;white-space:nowrap}
.ask svg{width:15px;height:15px}
.sg{display:inline-block;font:600 9.5px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:#5a3fb8;border:1px solid #cbbcf0;border-radius:8px;padding:0 6px;margin-left:8px;vertical-align:2px}
.need{display:inline-block;font:600 10px var(--fm);letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:1px 7px}
.need.t1{background:#e3f4ec;color:#1b6b45}.need.t2{background:#e4edf9;color:#1d58a8}.need.t3{background:#efe9fb;color:#5a3fb8}
.idea{display:grid;grid-template-columns:170px 1fr;gap:6px 22px;padding:14px 0;border-bottom:1px solid var(--wash)}
.idea h3{margin:0 0 3px;font:600 15px var(--fm)}
.idea p{margin:0;color:#4d535d;font-size:13.5px}
.idea .why{color:var(--mut);font-size:12.5px;margin-top:4px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;font-size:13px;display:none;z-index:9;max-width:80vw}
@media(max-width:820px){.cols{grid-template-columns:1fr}.hero{font-size:32px}.stats{grid-template-columns:repeat(2,1fr)}.sbar{grid-template-columns:130px 1fr 100px}.idea{grid-template-columns:1fr}}

/* ===== chart animation on hover (animated copy) ===== */
svg.anim-on .a-line{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s cubic-bezier(.65,0,.35,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
svg.anim-on .a-fade{animation:afade .8s ease both;animation-delay:.3s}
@keyframes afade{from{opacity:0}}
svg.anim-on .a-pop{transform-box:fill-box;transform-origin:center;animation:apop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes apop{from{transform:scale(0)}to{transform:scale(1)}}
svg.anim-on .a-grow{transform-box:fill-box;animation:agrow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes agrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.anim-bars.anim-on .fill{animation:abar .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes abar{from{width:0}}
@media (prefers-reduced-motion: reduce){svg.anim-on *,.anim-bars.anim-on *{animation:none!important}}

/* ===== EXPERIMENT E1–E10 ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 4px}
.kpi{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;background:var(--paper)}
.kpi .l{font:600 10.5px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font:26px/1.2 var(--fh)}.kpi .d{font-size:12px;color:var(--mut)}
.kpi svg{display:block;margin-top:6px}
.cmp{display:inline-flex;border:1px solid var(--rule);border-radius:14px;overflow:hidden;font-size:12px;vertical-align:middle;margin-left:8px}
.cmp span{padding:2px 10px;cursor:pointer;color:var(--mut)}.cmp span.on{background:var(--ink);color:var(--paper)}
.chg{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--wash);font-size:13.5px}
.chg .ar{font-weight:700}
/* E9b: hover card replaces the text line under each chart */
.read{display:none}
#ttip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;line-height:1.45;padding:8px 10px;border-radius:8px;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transition:opacity .12s}
#ttip .mut{color:#c7ceda}
.wfx{font-size:13px;color:#4d535d;margin:6px 0 0}
.modebtn{margin-left:10px;border:1px solid var(--rule);background:transparent;border-radius:14px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}
html.dark{filter:invert(.92) hue-rotate(180deg);background:#fafaf7}
html.dark img{filter:invert(1) hue-rotate(180deg)}
#chatbtn{position:fixed;right:22px;bottom:22px;width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,#1663c7,#21b07c);color:#fff;box-shadow:0 8px 24px rgba(22,99,199,.35);z-index:40;display:flex;align-items:center;justify-content:center}
#chatbtn svg{width:24px;height:24px}
#chat{position:fixed;right:22px;bottom:88px;width:360px;max-width:calc(100vw - 32px);height:480px;max-height:70vh;background:var(--paper);border:1px solid var(--rule);border-radius:16px;box-shadow:0 18px 50px rgba(20,32,46,.22);z-index:40;display:none;flex-direction:column;overflow:hidden}
#chat.open{display:flex}
#chat .ch{padding:12px 14px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px}
#chat .ch b{font-size:14px}#chat .ch .tag{margin-left:auto}
#chat .cstudio{background:#fff7e3;border-bottom:1px solid #efd58e;color:#6f5200;font-size:11.5px;line-height:1.45;padding:8px 14px}
#chat .cb{flex:1;overflow:auto;padding:12px 14px;font-size:13px}
#chat .m{margin:0 0 10px;max-width:88%;padding:8px 11px;border-radius:12px;line-height:1.45}
#chat .m.u{margin-left:auto;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}
#chat .m.a{background:var(--wash);border-bottom-left-radius:4px}
#chat .m.a .src{display:block;color:var(--mut);font-size:11px;margin-top:4px}
#chat .sq{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
#chat .sq span{font-size:11.5px;border:1px solid var(--rule);border-radius:12px;padding:3px 9px;cursor:pointer}
#chat .sq span:hover{border-color:var(--ink)}
#chat form{display:flex;border-top:1px solid var(--rule)}
#chat input{flex:1;border:0;padding:12px 14px;font:inherit;background:transparent;outline:none;color:var(--ink);width:auto}
#chat button.s{border:0;background:transparent;color:var(--acc);font-weight:600;padding:0 14px;cursor:pointer}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.how{background:var(--wash);border:1px solid var(--rule);border-radius:10px;padding:9px 14px;font-size:13px;margin:12px 0 4px;position:relative;padding-right:34px}.how .hx{position:absolute;right:12px;top:8px;cursor:pointer;color:var(--mut)}
.scopebar{display:block!important}
.sc.w{background:#e6f4ec;color:#2f7d4f}
.prt{margin-left:10px;font:inherit;font-size:12px;border:1px solid var(--rule);background:#fff;border-radius:6px;padding:3px 10px;cursor:pointer}
@media print{.hdr .modebtn,.top .views,#scopebar,#toast,.prt,#foot,.ask{display:none!important}body{background:#fff}.op section{break-inside:avoid}}
.views span[data-view="ideas"]{margin-left:14px;padding-left:16px;border-left:1px dashed var(--rule)}.sc.i{background:#fff4e0;color:#8a5a12;font-style:normal}.rmtag{display:inline-flex;align-items:center;gap:10px;background:#fff8ec;border:1px dashed #d9b77a;border-radius:8px;padding:6px 12px;font-size:12.5px;color:#8a5a12;margin:6px 0 12px}.idea{border-left:3px dashed #d9b77a;padding-left:12px}</style>
</head>

/* ===== chart animation (animated copy): each chart builds up once: on tab open if visible, otherwise when first scrolled into view; never on hover; text and layout do not move ===== */
(function(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('anim-on');io.unobserve(e.target);}}),{threshold:.25}):null;
  function once(el){if(io)io.observe(el);else requestAnimationFrame(()=>el.classList.add('anim-on'));}
  function prep(svg){
    if(svg.dataset.anim)return;svg.dataset.anim=1;
    svg.querySelectorAll('polyline').forEach(p=>{if((p.id||'').endsWith('_wl'))return;if(p.getAttribute('stroke-dasharray'))return;try{p.style.setProperty('--len',p.getTotalLength());p.classList.add('a-line');}catch(e){}});
    svg.querySelectorAll('polygon').forEach(p=>{if(!(p.id||'').endsWith('_wp'))p.classList.add('a-fade');});
    svg.querySelectorAll('circle').forEach((c,k)=>{if((c.id||'').includes('_wc'))return;c.classList.add('a-pop');c.style.animationDelay=(0.35+k*0.035)+'s';});
    const zero=svg.querySelector('line[stroke="#6f7480"]'),zy=zero?+zero.getAttribute('y1'):null;
    svg.querySelectorAll('rect').forEach(r=>{if(!r.querySelector('title'))return;const y=+r.getAttribute('y'),h=+r.getAttribute('height');
      r.classList.add('a-grow');r.style.transformOrigin=(zy==null||Math.abs(y+h-zy)<1)?'center bottom':'center top';r.style.animationDelay=(+r.getAttribute('x')/(svg.viewBox.baseVal.width||1000)*0.5)+'s';});
    once(svg);
  }
  function prepBars(box){if(box.dataset.anim)return;box.dataset.anim=1;box.classList.add('anim-bars');once(box);}
  function scan(){const v=document.getElementById('view');if(!v)return;v.querySelectorAll('svg[viewBox]').forEach(prep);
    const boxes=new Set();v.querySelectorAll('.bar, .sbar').forEach(b=>boxes.add(b.parentElement));boxes.forEach(prepBars);}
  new MutationObserver(scan).observe(document.getElementById('view'),{childList:true,subtree:true});
  scan();
})();

function stackSvg(){const w=760,h=220,L=50,Rr=14,T=12,B=26,n=W.length,mx=Math.ceil(Math.max(...WK.map(x=>x.cash))/100)*100,X=i=>L+i*(w-L-Rr)/(n-1),Y=v=>T+(mx-v)/mx*(h-T-B);
  const lay=[['mmf','#21b07c','Money market funds'],['fd','#1663c7','Time deposits'],['ca','#9fb8d6','Operating accounts']];let g='';
  for(let v=0;v<=mx;v+=100)g+=`<line x1="${L}" x2="${w-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6e9ee"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  let base=WK.map(()=>0);lay.forEach(([k,col,l])=>{const top=WK.map((x,i)=>base[i]+x[k]);g+=`<polygon points="${top.map((v,i)=>X(i)+','+Y(v)).join(' ')} ${base.map((v,i)=>X(i)+','+Y(v)).reverse().join(' ')}" fill="${col}" opacity=".85"><title>${l}</title></polygon>`;base=top;});
  const i23=W.indexOf('23 Oct');g+=`<line x1="${X(i23)}" x2="${X(i23)}" y1="${T}" y2="${h-B}" stroke="#14202e" stroke-dasharray="3 3" opacity=".5"/><text x="${X(i23)-6}" y="${T+12}" text-anchor="end" style="font-size:10.5px;font-weight:600;fill:#14202e">USD 20m into funds</text>`;
  W.forEach((l,i)=>{if(i%2===0||i===n-1)g+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle">${l}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${g}</svg><div class="presets" style="font-size:12px;color:var(--mut)">${lay.slice().reverse().map(([k,c,l])=>`<span><i style="display:inline-block;width:10px;height:10px;background:${c};margin-right:5px;vertical-align:-1px"></i>${l}</span>`).join('')}</div>`;}
function waterfall(i){const r=R[i];if(!i)return '<p class="note">Pick a later week: 07 Aug is the first week in the file.</p>';
  const st=[['Opening',r.o,'t'],['Receipts',r.r,'d'],['Payments',-r.p,'d'],['Financing',r.f,'d'],['FX',r.x,'d'],['Closing',r.c,'t']].filter(s=>s[2]==='t'||Math.abs(s[1])>0.05);
  const w=520,h=40+st.length*28,L=96,Rr=60;let run=0;const lv=st.map(s=>{if(s[2]==='t'){run=s[1];return[0,s[1]]}const a=run;run+=s[1];return[a,run]});const mx=Math.max(...lv.flat())*1.05,x=v=>L+v/mx*(w-L-Rr);let g='';
  st.forEach((q,k)=>{const yy=10+k*28,[a,b]=lv[k],col=q[2]==='t'?'#14202e':q[0]==='Financing'?'#6f56d1':q[1]>=0?'#2f7d4f':'#b8321f';g+=`<text x="${L-8}" y="${yy+13}" text-anchor="end" style="font-size:11.5px;fill:#22324a">${q[0]}</text><rect x="${x(Math.min(a,b))}" y="${yy}" width="${Math.max(2,Math.abs(x(b)-x(a)))}" height="18" rx="3" fill="${col}"/><text x="${x(Math.max(a,b))+5}" y="${yy+13}" style="font-size:11px;fill:#22324a">${q[2]==='t'?f1(q[1]):sg(q[1])}</text>`;});
  const p=WK[i-1],c=WK[i],moves=[['Operating accounts',c.ca-p.ca],['Time deposits',c.fd-p.fd],['Money market funds',c.mmf-p.mmf]].filter(m=>Math.abs(m[1])>=1).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  const bm=BK.map(b=>[b.bank,b.tot[i]-b.tot[i-1]]).filter(m=>Math.abs(m[1])>=1).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,2);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:620px">${g}</svg><p class="wfx"><b>Week ending ${r.w}:</b> cash ${r.c-r.o>=0?'up':'down'} ${aed(Math.abs(r.c-r.o))}. ${moves.length?'Instruments: '+moves.map(m=>`${m[0].toLowerCase()} ${sg(m[1])}m`).join(', ')+'.':''} ${bm.length?'Banks: '+bm.map(m=>`${m[0]} ${sg(m[1])}m`).join(', ')+'.':''}</p><p class="note">Opening, closing, FX and the instrument and bank moves are from your bank statement data; the receipts and payments split comes from statement transactions (simulated here).</p>`;}
const _rh=renderHistory;renderHistory=function(){_rh();

};

  [0,.25,.5,.75,1].forEach(v=>g+=`<line x1="${L}" x2="${w-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6e9ee"/><text x="${L-5}" y="${Y(v)+4}" text-anchor="end">${v*100}%</text>`);
  g+=`<line id="bs_g" x1="0" x2="0" y1="${T}" y2="${h-B}" stroke="#14202e" opacity="0"/>`;

  W.forEach((l,i)=>{if(i%2===0||i===n-1)g+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle">${l}</text>`;});
  const tbl=`<table style="margin-top:8px"><tr><th>Bank</th><th>13 weeks</th><th class="n">Now</th><th class="n">Share</th></tr>${top.map((b,k)=>`<tr><td>${b.bank}</td><td>${spark(b.tot,160,24,cols[k%5])}</td><td class="n">${f1(b.tot[12])}</td><td class="n">${pc(b.tot[12]/WK[12].cash)}</td></tr>`).join('')}</table>`;
  const q=document.getElementById('q').closest('p');
  q.insertAdjacentHTML('beforebegin',`<section style="border-top:0;padding-top:10px"><div class="cols"><div><h2>Bank share over 13 weeks</h2><svg id="bs" viewBox="0 0 ${w} ${h}" width="100%">${g}</svg><p class="note">Concentration score (sum of squared shares, 1 = one bank): ${hhi[12].toFixed(2)} now, ${hhi[0].toFixed(2)} on 07 Aug. Money market funds rose after the 25 Sep top-up.</p></div><div><h2>By bank</h2>${tbl}</div></div></section>`);
  /* E6 hover: guide line and a card with every bank's share that week */
  const sv=document.getElementById('bs'),gl=document.getElementById('bs_g');
  sv.onmousemove=ev=>{const r=sv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*w;let i=Math.round((x-L)/((w-L-Rr)/(n-1)));i=Math.max(0,Math.min(n-1,i));gl.setAttribute('x1',X(i));gl.setAttribute('x2',X(i));gl.setAttribute('opacity','.3');
    tipShow(ev,`<b>${W[i]}</b>: cash ${aed(WK[i].cash)}<br>`+top.map((b,k)=>`<span style="color:${cols[k%5]}">&#9632;</span> ${b.bank} ${pc(b.tot[i]/WK[i].cash)} <span class="mut">(${f1(b.tot[i])})</span>`).join('<br>')+`<br><span class="mut">Concentration score ${hhi[i].toFixed(2)}</span>`);};
  sv.onmouseleave=()=>{gl.setAttribute('opacity','0');tipHide();};
};

(function(){const b=document.createElement('button');b.className='modebtn';b.textContent='Dark';b.onclick=()=>{const d=document.documentElement.classList.toggle('dark');b.textContent=d?'Light':'Dark';};document.querySelector('.hdr .wrap').appendChild(b);})();
